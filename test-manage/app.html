<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Bank &amp; Test Builder</title>
<style>
:root {
  --paper:#fafaf9; --surface:#fff; --ink:#1c1917; --muted:#78716c; --muted-2:#a8a29e;
  --line:#e7e5e4; --line-2:#d6d3d1;
  --teal:#0f766e; --teal-dark:#115e59; --teal-light:#f0fdfa; --teal-line:#99f6e4;
  --emerald-bg:#ecfdf5; --emerald-line:#a7f3d0; --emerald-text:#047857;
  --rose:#e11d48; --rose-bg:#fff1f2; --rose-line:#fecdd3; --rose-text:#be123c;
  --amber-bg:#fffbeb; --amber-line:#fde68a; --amber-text:#92400e;
  --sky-bg:#e0f2fe; --sky-line:#bae6fd; --sky-text:#0369a1;
  --violet-bg:#f5f3ff; --violet-line:#ddd6fe; --violet-text:#6d28d9;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body { background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; }
h1 { font-family:Georgia,"Times New Roman",serif; font-size:22px; font-weight:600; margin:0; letter-spacing:-0.01em; }
h2.panel-title { font-family:Georgia,"Times New Roman",serif; font-size:15px; font-weight:600; margin:0; }
.wrap { max-width:1280px; margin:0 auto; padding:28px 24px; }
.muted { color:var(--muted); }
.mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
.xs { font-size:11px; }
.bold { font-weight:600; }
.truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row { display:flex; align-items:center; }
.row-between { display:flex; align-items:center; justify-content:space-between; }
.row-end { display:flex; justify-content:flex-end; }
.gap-1 { gap:4px; } .gap-2 { gap:8px; }
.wrap-flex { flex-wrap:wrap; }
.ml-auto { margin-left:auto; }
.spacer { flex:1; }

.header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.header-top p { margin:4px 0 0; font-size:13px; color:var(--muted); }
.header-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
.err-text { color:var(--rose); font-size:12px; }
.link { background:none; border:none; color:var(--muted); text-decoration:underline dotted; cursor:pointer; font-size:12px; padding:0; }
.link:hover { color:var(--ink); }
.link-danger { background:none; border:none; color:var(--rose); font-weight:600; cursor:pointer; font-size:12px; }
.banner-amber { background:var(--amber-bg); border:1px solid var(--amber-line); color:var(--amber-text); border-radius:6px; padding:8px 12px; font-size:12px; margin-top:10px; }

.two-col { display:grid; grid-template-columns:1fr; gap:24px; margin-top:20px; }
@media (min-width:1024px) { .two-col { grid-template-columns:1fr 1fr; } }

.panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; }
.panel-header { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
.panel-header-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }

.btn { font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:4px; }
.btn-sm { padding:4px 8px; font-size:11px; }
.btn-xs { padding:2px 6px; font-size:11px; border-radius:4px; }
.btn-primary { background:var(--teal); color:#fff; border-color:var(--teal); }
.btn-primary:hover { background:var(--teal-dark); }
.btn-outline { background:#fff; color:var(--ink); border-color:var(--line-2); }
.btn-outline:hover { background:#f5f5f4; }
.btn-danger { background:var(--rose); color:#fff; }
.btn-danger:hover { background:#be123c; }
.btn-danger-outline { background:#fff; color:var(--rose-text); border-color:var(--rose-line); }
.btn-danger-outline:hover { background:var(--rose-bg); }
.btn-dashed { width:100%; padding:10px; border-radius:6px; border:1px dashed var(--line-2); background:none; color:var(--muted); cursor:pointer; font-size:12px; }
.btn-dashed:hover { border-color:var(--teal); color:var(--teal); }
button:disabled { opacity:0.4; cursor:not-allowed; }

.form-input, .form-textarea { width:100%; border:1px solid var(--line-2); border-radius:6px; padding:8px 10px; font-size:13px; font-family:inherit; }
.form-input.sm { width:110px; padding:5px 8px; font-size:12px; }
.form-input:focus, .form-textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-light); }
.search-wrap { position:relative; }
.search-wrap input { padding-left:30px; }
.search-icon { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--muted-2); pointer-events:none; }

.chip-row { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font-family:monospace; font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:#fafaf9; color:var(--muted); cursor:pointer; }
.chip-inactive:hover { background:#f0f0ef; }
.chip-active { box-shadow:0 0 0 1px var(--teal); }
.chip-x { background:none; border:none; color:var(--muted-2); cursor:pointer; margin-left:2px; font-size:13px; }

.tag-pill { font-family:monospace; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid; }
.tag-0 { background:var(--emerald-bg); border-color:var(--emerald-line); color:var(--emerald-text); }
.tag-1 { background:var(--sky-bg); border-color:var(--sky-line); color:var(--sky-text); }
.tag-2 { background:var(--amber-bg); border-color:var(--amber-line); color:var(--amber-text); }
.tag-3 { background:var(--rose-bg); border-color:var(--rose-line); color:var(--rose-text); }
.tag-4 { background:var(--violet-bg); border-color:var(--violet-line); color:var(--violet-text); }
.tag-5 { background:var(--teal-light); border-color:var(--teal-line); color:var(--teal-dark); }

.bulk-toolbar { padding:8px 18px; background:var(--teal-light); border-bottom:1px solid var(--teal-line); display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:12px; }
.dropdown { position:relative; }
.dropdown-menu { position:absolute; z-index:20; top:100%; margin-top:4px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 16px rgba(0,0,0,.08); min-width:140px; }
.dropdown-menu button { display:block; width:100%; text-align:left; padding:7px 12px; border:none; background:none; cursor:pointer; font-size:12px; white-space:nowrap; }
.dropdown-menu button:hover { background:#f5f5f4; }

.scroll-list { flex:1; overflow-y:auto; max-height:100vh; }
.scroll-list.pad { padding:16px; display:flex; flex-direction:column; gap:14px; }
.empty { padding:32px; text-align:center; font-size:13px; color:var(--muted-2); }
.empty-sm { padding:10px; text-align:center; font-size:11px; color:var(--muted-2); }

.q-card { padding:12px 18px; display:flex; gap:10px; cursor:grab; border-bottom:1px solid #f4f4f3; }
.q-card:hover { background:#fafaf9; }
.q-card:active { cursor:grabbing; }
.q-card-selected { background:var(--teal-light); }
.grip { color:var(--muted-2); flex-shrink:0; margin-top:2px; }
.q-body { flex:1; min-width:0; }
.q-text { font-size:13px; color:#292524; margin-top:2px; }
.tag-row { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.q-actions { display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; }
.icon-btn { background:none; border:none; cursor:pointer; color:var(--muted-2); font-size:13px; padding:2px; line-height:1; }
.icon-btn:hover { color:var(--teal); }
.icon-btn.danger:hover { color:var(--rose); }

.test-tab { }
.test-tab-active { background:var(--teal); color:#fff; border-color:var(--teal); }
.hint { font-size:11px; color:var(--muted-2); margin:0; }
.rename-input { font-size:12px; padding:4px 8px; border:1px solid var(--teal); border-radius:6px; }

.group-card { border:1px solid var(--line); border-radius:8px; }
.group-card-dashed { border-style:dashed; }
.group-card-over { border-color:var(--teal) !important; background:var(--teal-light); }
.group-header { padding:9px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
.group-name-input { font-size:13px; font-weight:600; border:none; background:none; flex:1; min-width:0; padding:2px 4px; border-radius:4px; }
.group-name-input:focus { outline:none; background:#fafaf9; }
.group-name { font-size:13px; font-weight:600; }
.mini-btn { background:none; border:none; color:var(--muted-2); cursor:pointer; font-size:10px; padding:0 2px; }
.group-body { padding:8px; display:flex; flex-direction:column; gap:8px; min-height:50px; }

.row-card { border:1px solid var(--line); border-radius:6px; padding:10px; background:#fff; cursor:grab; }
.row-card:hover { border-color:var(--teal-line); }
.row-card:active { cursor:grabbing; }
.row-inner { display:flex; align-items:flex-start; gap:8px; }
.row-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.option-line { font-size:12px; display:flex; gap:6px; align-items:flex-start; }
.option-correct { color:var(--emerald-text); }
.option-wrong { color:var(--muted); }
.row-actions { display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; }

.modal-overlay { position:fixed; inset:0; background:rgba(28,25,23,.4); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
.modal { background:#fff; border:1px solid var(--line); border-radius:10px; width:100%; max-width:620px; max-height:100vh; overflow-y:auto; }
.modal-sm { max-width:460px; }
.modal-header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; justify-content:space-between; position:sticky; top:0; background:#fff; }
.modal-header h2 { font-family:Georgia,serif; font-size:16px; margin:0; }
.warn-icon { color:var(--amber-text); }
.modal-body { padding:18px 22px; display:flex; flex-direction:column; gap:14px; }
.modal-footer { padding:14px 22px; border-top:1px solid var(--line); position:sticky; bottom:0; background:#fff; display:flex; flex-direction:column; gap:8px; }
.form-field label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:4px; }
.answer-block { border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:6px; position:relative; }
.correct-block { background:var(--emerald-bg); border:1px solid var(--emerald-line); }
.correct-block label { color:var(--emerald-text); }
.wrong-block { background:var(--rose-bg); border:1px solid var(--rose-line); }
.wrong-remove { position:absolute; top:6px; right:6px; }
.ref-list { font-size:13px; padding-left:18px; margin:0; }
.history-entry { border:1px solid var(--line); border-radius:6px; padding:10px; margin-bottom:10px; }
.history-current { border-color:var(--teal-line); background:var(--teal-light); }

.loading { min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted-2); }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="backup-file-input" accept="application/json" style="display:none" onchange="onBackupFileSelected(event)">

<script>
/* ---------- small helpers ---------- */
function uid(prefix) {
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}
function esc(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function tagColorIndex(tag) {
  var h = 0;
  for (var i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
  return h % 6;
}
function downloadJSON(obj, filename) {
  var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- data helpers (pure) ---------- */
function migrateData(data) {
  var questions = (data.questions || []).map(function (q) {
    return {
      id: q.id || uid("q"),
      familyId: q.familyId || q.id || uid("fam"),
      version: q.version || 1,
      history: q.history || [],
      updatedAt: q.updatedAt || Date.now(),
      category: q.category || "",
      text: q.text || "",
      correct: q.correct || { text: "", justification: "" },
      wrong: q.wrong || [],
      tags: q.tags || [],
    };
  });
  var tests = (data.tests || []).map(function (t) {
    return {
      id: t.id || uid("test"),
      name: t.name || "Test",
      looseQuestionIds: t.looseQuestionIds || [],
      groups: (t.groups || []).map(function (g) {
        return { id: g.id || uid("grp"), name: g.name || "Group", questionIds: g.questionIds || [] };
      }),
    };
  });
  return { questions: questions, tests: tests };
}
function snapshotOf(q) {
  return { version: q.version, savedAt: q.updatedAt, category: q.category, text: q.text, correct: q.correct, wrong: q.wrong, tags: q.tags };
}
function findReferences(testsArr, questionId) {
  var refs = [];
  testsArr.forEach(function (t) {
    if (t.looseQuestionIds.indexOf(questionId) !== -1) refs.push({ testName: t.name, where: "ungrouped" });
    t.groups.forEach(function (g) {
      if (g.questionIds.indexOf(questionId) !== -1) refs.push({ testName: t.name, where: g.name });
    });
  });
  return refs;
}
function withQuestionRemoved(test, questionId) {
  return {
    id: test.id,
    name: test.name,
    looseQuestionIds: test.looseQuestionIds.filter(function (id) { return id !== questionId; }),
    groups: test.groups.map(function (g) {
      return { id: g.id, name: g.name, questionIds: g.questionIds.filter(function (id) { return id !== questionId; }) };
    }),
  };
}
function locLit(loc) {
  return loc.type === "loose" ? "{type:'loose'}" : "{type:'group',groupId:'" + loc.groupId + "'}";
}

function seedQuestions() {
  var raw = [
    {
      category: "combined (cyber intelligence) — case study: Darknet Diaries Ep.178 'Ubiquiti'",
      text: "The engineer already had the technical skill to abuse the company's cloud environment (capability) and, after years of feeling underpaid and overlooked, the personal grievance to want to act on it (intent). What he lacked for a long time was a way to reach the master credential vault without immediate suspicion — something the shift to near-universal remote work during the pandemic quietly gave him, since privileged remote access to the cloud environment became routine for his role. Using the standard threat equation from the course, which missing element did remote work primarily supply, completing the threat?",
      correctText: "Opportunity — Threat = Intent + Capability + Opportunity; remote access removed the practical barrier that had been keeping an already-motivated, already-skilled insider from acting",
      correctJust: "The course defines a threat as the combination of Intent, Capability and Opportunity. In this case, Nick's discontent (intent) and his cloud engineering expertise (capability) both predate the pandemic; what changed was routine, less-scrutinized remote access to privileged systems, which supplied the missing opportunity to act on an intent and capability he already had.",
      wrong: [
        { text: "Intent — remote work is what first made him resentful about his pay and lack of recognition", justification: "His resentment grew from years of pay and promotion decisions, not from the work-from-home arrangement itself." },
        { text: "Capability — remote work is what taught him the technical skills needed to navigate the cloud environment", justification: "His technical skill came from his career at AWS and then Ubiquiti, well before the pandemic reshaped work arrangements." },
        { text: "Attribution — remote work is what allowed investigators to identify him as the culprit", justification: "Attribution is a separate, later problem for defenders/investigators; it is not one of the three elements of the threat equation." },
        { text: "None of the others.", justification: "One option correctly names the missing element of the threat equation." },
      ],
      tags: ["cyber-intel", "ubiquiti-case-study"],
    },
    {
      category: "combined (offensive) — case study: Darknet Diaries Ep.178 'Ubiquiti'",
      text: "In his anonymous ransom email, the engineer claimed to be an unrelated outside hacker, demanded 25 Bitcoin, and dangled a second 'secret backdoor' for an additional 25 Bitcoin — all while secretly being the Ubiquiti employee assigned to help investigate the very 'breach' he had staged. Using the JP 3-13 desired-effects framework from the course, which effect does constructing this false external-attacker persona best represent?",
      correctText: "Deceive — to cause a person (here, the company's leadership and investigators) to believe what is not true",
      correctJust: "Nothing about the ransom persona or the backdoor claim damaged, denied or degraded any system — its entire purpose was to make Ubiquiti's leadership and investigators believe a sophisticated outside actor was responsible, which matches the course's definition of Deceive exactly.",
      wrong: [
        { text: "Destroy — to damage a system so badly it cannot be restored without being entirely rebuilt", justification: "No systems were rendered permanently unusable by the ransom note or the false persona itself." },
        { text: "Deny — to prevent the adversary from accessing and using critical information, systems and services", justification: "The company's systems remained accessible to legitimate users throughout; nothing was denied." },
        { text: "Degrade — to reduce the effectiveness or efficiency of adversary C2 or communications systems", justification: "No communications or command-and-control systems were degraded by posing as an outsider." },
        { text: "Influence — to cause others to behave in a manner favorable to friendly forces", justification: "Influence is about shaping behavior toward the attacker's favor in a broad strategic sense; here the mechanism is specifically getting the target to believe a false claim, which is Deceive." },
      ],
      tags: ["offensive", "ubiquiti-case-study"],
    },
    {
      category: "combined (tools and tactics + defensive) — case study: Darknet Diaries Ep.178 'Ubiquiti'",
      text: "Before staging the extortion attempt, the engineer privately messaged a colleague asking whether an employee could be paid through the company's bug-bounty program for reporting a security issue. The colleague found the question odd, given no such issue had been reported, and quietly saved the message. That saved message later became part of the evidence trail. Which course concept does the colleague's reaction best illustrate?",
      correctText: "Monitoring employee behaviour — closely observing and noting unusual conduct, even when not obviously malicious at the time, is a recognized and valuable defensive measure, especially around sensitive infrastructure",
      correctJust: "No technical control caught this — a human colleague noticed an inconsistency (a question implying knowledge of an unreported issue) and preserved it. This matches the course's point that closely monitoring employee behaviour, including seemingly small anomalies, is a valuable practice in environments hosting sensitive infrastructure, and it can generate evidence long before a technical alert ever fires.",
      wrong: [
        { text: "Least privilege authorization — the colleague should have restricted the engineer's bug-bounty program access", justification: "Access scoping addresses what systems a user can reach, not how a suspicious verbal or written question gets noticed and escalated." },
        { text: "Packet filtering — the message should have been automatically blocked by a networking device", justification: "Packet filtering operates on network traffic, not on the content or intent behind an internal chat message between colleagues." },
        { text: "Communication encryption — the message should have been encrypted to prevent later use as evidence", justification: "Encryption protects confidentiality in transit or storage; it has nothing to do with why this message was significant, and encrypting it would not have prevented it from being used as evidence once disclosed." },
        { text: "None of the others.", justification: "One option correctly names the concept the colleague's behaviour illustrates." },
      ],
      tags: ["defensive", "tools-tactics", "ubiquiti-case-study"],
    },
    {
      category: "combined (defensive) — case study: Darknet Diaries Ep.178 'Ubiquiti'",
      text: "As part of the investigation, forensic examiners reviewed hours of footage from the company-issued security camera and dissected the engineer's company-issued laptop bit by bit — and found nothing. The intrusion had in fact been carried out from a separate, personal MacBook connected through his home Wi-Fi router, a device the company had no visibility into at all. What does this best illustrate about defending against insider threats operating from home?",
      correctText: "Physical security and monitoring of company-issued devices have limited value against an insider using personal, unmonitored hardware and networks; effective detection has to extend to anomalous use of the privileged accounts and credentials themselves, not just the endpoints the organization controls",
      correctJust: "The case shows a clean split between the company's visibility (camera footage, the issued laptop — both clean) and where the actual attack occurred (a personal device on a home network). This is precisely why detection ultimately had to rely on account/credential-level evidence — anomalous logins, session renaming, log-retention changes — rather than on monitoring physical assets, illustrating that insider-threat defense must follow the account and the data, not just the hardware the organization owns.",
      wrong: [
        { text: "Reviewing camera footage and company devices is always sufficient to detect an insider attack, so the investigators must have missed something on the seized laptop", justification: "The case is presented explicitly as a gap: physical/device monitoring found nothing, which is the point being tested, not evidence of an investigative failure." },
        { text: "Since the personal laptop was outside company control, the intrusion legally could not be attributed to the employee at all", justification: "Attribution ultimately succeeded through IP, MAC-address and traffic-volume analysis at the router and through account activity logs — the personal device did not place the intrusion outside investigative reach." },
        { text: "Physical security measures are irrelevant to every category of cyber threat and should be deprioritized generally", justification: "Physical security remains highly relevant for other threat categories (e.g., theft of hardware, unauthorized facility access); the point here is narrower — it has limited value against this specific insider scenario." },
        { text: "None of the others.", justification: "One option correctly states the lesson about defending beyond company-owned endpoints." },
      ],
      tags: ["defensive", "ubiquiti-case-study"],
    },
    {
      category: "combined (offensive + defensive, ethics) — case study: Darknet Diaries Ep.178 'Ubiquiti'",
      text: "At sentencing, the engineer argued the entire episode was really an unsanctioned 'security drill' meant to force the company to take its vulnerabilities seriously, and asked for no prison time. The judge rejected this framing and imposed a six-year sentence. Based on how the course distinguishes legitimate security testing (e.g., authorized penetration testing, bug-bounty programs) from illegitimate activity, why does this defense fail?",
      correctText: "Legitimate security testing requires prior authorization, a defined scope, and transparency with the organization; here the activity was concealed, involved covering tracks, an extortion demand for money, and false statements to federal investigators — none of which are compatible with an authorized test regardless of the stated intent",
      correctJust: "The course frames authorized offensive activity (bug bounties, sanctioned red-teaming) as bounded by prior authorization and defined scope. Here, every hallmark of a legitimate test was absent: the activity was hidden through obfuscation, a genuine ransom was demanded, and the engineer lied to the FBI — factors the court treated as decisive, resulting in guilty pleas to damaging protected computers, wire fraud and false statements.",
      wrong: [
        { text: "Any employee with sufficient technical skill is automatically authorized to test their employer's production systems without approval", justification: "Technical skill or job role does not confer authorization; scope and prior approval are what define legitimate testing, and neither was present here." },
        { text: "A stated good intention legally converts an unauthorized intrusion into an authorized one after the fact", justification: "Motive can be considered at sentencing, but it does not retroactively authorize an intrusion or excuse extortion and lying to federal investigators — the guilty plea and sentence reflect this." },
        { text: "Because Ubiquiti's security practices were genuinely weak, exploiting them was not a crime", justification: "The presence of real vulnerabilities does not make unauthorized exploitation lawful; the course's ethical-hacking framing is about authorization, not about whether flaws existed." },
        { text: "Since no ransom was ultimately paid, no crime occurred", justification: "The wire fraud and computer damage charges rested on the intrusion, exfiltration and extortion attempt itself, not on whether the ransom was ultimately collected." },
      ],
      tags: ["offensive", "defensive", "ethics", "ubiquiti-case-study"],
    },
  ];
  return raw.map(function (r) {
    var id = uid("q");
    return {
      id: id, familyId: id, version: 1, history: [], updatedAt: Date.now(),
      category: r.category, text: r.text,
      correct: { text: r.correctText, justification: r.correctJust },
      wrong: r.wrong, tags: r.tags,
    };
  });
}

/* ---------- IndexedDB ---------- */
var DB_NAME = "qbank-db", DB_VERSION = 1, db = null;
function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function (e) {
      var idb = e.target.result;
      if (!idb.objectStoreNames.contains("questions")) idb.createObjectStore("questions", { keyPath: "id" });
      if (!idb.objectStoreNames.contains("tests")) idb.createObjectStore("tests", { keyPath: "id" });
    };
    req.onsuccess = function (e) { resolve(e.target.result); };
    req.onerror = function (e) { reject(e.target.error); };
  });
}
function idbGetAll(storeName) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(storeName, "readonly");
    var req = tx.objectStore(storeName).getAll();
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbPut(storeName, value) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(value);
    tx.oncomplete = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbDelete(storeName, id) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbClear(storeName) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).clear();
    tx.oncomplete = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbBulkPut(storeName, values) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(storeName, "readwrite");
    var store = tx.objectStore(storeName);
    values.forEach(function (v) { store.put(v); });
    tx.oncomplete = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}
async function persistQuestionPut(q) {
  if (!dbAvailable) return;
  try { await idbPut("questions", q); dbSaveError = false; } catch (e) { dbSaveError = true; refreshHeader(); }
}
async function persistQuestionDelete(id) {
  if (!dbAvailable) return;
  try { await idbDelete("questions", id); dbSaveError = false; } catch (e) { dbSaveError = true; refreshHeader(); }
}
async function persistTestPut(t) {
  if (!dbAvailable || !t) return;
  try { await idbPut("tests", t); dbSaveError = false; } catch (e) { dbSaveError = true; refreshHeader(); }
}
async function persistTestDelete(id) {
  if (!dbAvailable) return;
  try { await idbDelete("tests", id); dbSaveError = false; } catch (e) { dbSaveError = true; refreshHeader(); }
}

/* ---------- state ---------- */
var questions = [], tests = [], loaded = false;
var dbAvailable = true, dbErrorMsg = "", dbSaveError = false;
var search = "", activeTags = new Set(), selected = new Set();
var formMode = null, editingId = null, editingContext = null, formState = null;
var pendingOverwrite = null, historyForId = null;
var importOpen = false, importText = "", importError = "";
var pendingDeleteQ = null, bulkTagInput = "";
var activeTestId = null, renamingTestId = null;
var pendingDeleteGroup = null, pendingDeleteTest = null, addToMenuOpen = false;
var pendingBackupLoad = null, backupError = "";
var resetConfirm = false;

/* ---------- init ---------- */
async function init() {
  if (!window.indexedDB) {
    dbAvailable = false;
    dbErrorMsg = "IndexedDB isn't available in this environment — changes will only last for this session. Download this file and open it directly in a browser tab (outside any embedded preview) to get persistent storage.";
    questions = seedQuestions();
    loaded = true;
    renderAll();
    return;
  }
  try {
    db = await openDB();
    var qs = await idbGetAll("questions");
    var ts = await idbGetAll("tests");
    if (qs.length === 0 && ts.length === 0) {
      questions = seedQuestions();
      await idbBulkPut("questions", questions);
    } else {
      var migrated = migrateData({ questions: qs, tests: ts });
      questions = migrated.questions;
      tests = migrated.tests;
    }
  } catch (e) {
    dbAvailable = false;
    dbErrorMsg = "Couldn't open IndexedDB — starting a fresh in-memory session (nothing will be saved on reload). Try opening this file directly in a browser tab instead of an embedded preview.";
    questions = seedQuestions();
  }
  activeTestId = tests[0] ? tests[0].id : null;
  loaded = true;
  renderAll();
}

/* ---------- render orchestration ---------- */

  var app = document.getElementById("app");

}

}

/* ---------- bank ---------- */
function filteredQuestions() {
  var s = search.trim().toLowerCase();
  return questions.filter(function (item) {
    if (activeTags.size > 0) {
      var hasTag = item.tags.some(function (t) { return activeTags.has(t); });
      if (!hasTag) return false;
    }
    if (!s) return true;
    var hay = ([item.category, item.text].concat(item.tags)).join(" ").toLowerCase();
    return hay.indexOf(s) !== -1;
  });
}
function tagChipsHTML() {
  var all = Array.from(new Set(questions.reduce(function (acc, q) { return acc.concat(q.tags); }, []))).sort();
  if (all.length === 0) return "";
  var chips = all.map(function (t) {
    var cls = "chip tag-" + tagColorIndex(t) + " " + (activeTags.has(t) ? "chip-active" : "chip-inactive");
    return '<button class="' + cls + '" data-tag="' + esc(t) + '" onclick="toggleTagFilter(this.dataset.tag)">' + esc(t) + '</button>';
  }).join("");
  if (activeTags.size > 0) chips += '<button class="link" onclick="clearTagFilters()">clear</button>';
  return chips;
}
function bulkToolbarHTML() {
  if (selected.size === 0) return "";
  var activeTest = tests.find(function (t) { return t.id === activeTestId; }) || null;
  var menu = "";

    menu = '<div class="dropdown-menu"><button onclick="addSelectedTo({type:\'loose\'})">Ungrouped</button>' +
      activeTest.groups.map(function (g) {
        return '<button onclick="addSelectedTo({type:\'group\',groupId:\'' + g.id + '\'})">' + esc(g.name) + '</button>';

  return '<div class="bulk-toolbar">' +
    '<span class="bold">' + selected.size + ' selected</span>' +
    '<input id="bulk-tag-input" class="form-input sm" placeholder="tag, tag" value="' + esc(bulkTagInput) + '" oninput="onBulkTagInput(event)">' +
    '<button id="apply-tag-btn" class="btn btn-primary btn-sm" ' + (bulkTagInput.trim() ? '' : 'disabled') + ' onclick="applyBulkTag()">Apply tag</button>' +
    '<div class="dropdown"><button class="btn btn-outline btn-sm" ' + (activeTest ? '' : 'disabled') + ' onclick="toggleAddToMenu()">Add to ▾</button>' + menu + '</div>' +
    '<button class="link ml-auto" onclick="clearSelection()">clear</button></div>';
}
function questionCardHTML(q) {

function bankListHTML() {
  var filtered = filteredQuestions();
  if (filtered.length === 0) {
    return '<div class="empty">' + (questions.length === 0 ? "No questions yet — add one or import a batch." : "No questions match this search or tag filter.") + '</div>';
  }
  return filtered.map(questionCardHTML).join('');
}
function onSearchInput(e) { search = e.target.value; refreshBank(); }
function toggleTagFilter(tag) { activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag); refreshBank(); }
function clearTagFilters() { activeTags = new Set(); refreshBank(); }
function toggleSelect(id) { selected.has(id) ? selected.delete(id) : selected.add(id); refreshBank(); }
function clearSelection() { selected = new Set(); refreshBank(); }
function onBulkTagInput(e) {
  bulkTagInput = e.target.value;
  var btn = document.getElementById("apply-tag-btn");
  if (btn) btn.disabled = !bulkTagInput.trim();
}
async function applyBulkTag() {
  var newTags = bulkTagInput.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
  if (newTags.length === 0) return;
  var changed = [];
  questions = questions.map(function (q) {
    if (!selected.has(q.id)) return q;
    var merged = { id: q.id, familyId: q.familyId, version: q.version, history: q.history, updatedAt: q.updatedAt, category: q.category, text: q.text, correct: q.correct, wrong: q.wrong, tags: Array.from(new Set(q.tags.concat(newTags))) };
    changed.push(merged);
    return merged;
  });
  bulkTagInput = "";
  await Promise.all(changed.map(persistQuestionPut));
  refreshBank();
}
function handleBankDragStart(e, id) {
  var ids = (selected.has(id) && selected.size > 1) ? Array.from(selected) : [id];
  e.dataTransfer.setData("application/json", JSON.stringify({ ids: ids }));
  e.dataTransfer.effectAllowed = "copy";
}
function askDeleteQuestion(id) { pendingDeleteQ = id; refreshBank(); }
function cancelDeleteQuestion() { pendingDeleteQ = null; refreshBank(); }
async function deleteQuestion(id) {
  questions = questions.filter(function (q) { return q.id !== id; });
  tests = tests.map(function (t) { return withQuestionRemoved(t, id); });
  selected.delete(id);
  pendingDeleteQ = null;
  await persistQuestionDelete(id);
  await Promise.all(tests.map(persistTestPut));
  refreshBank();
  refreshBuilder();
}
function toggleAddToMenu() { addToMenuOpen = !addToMenuOpen; refreshBank(); }
async function addSelectedTo(target) {
  if (!activeTestId) return;
  Array.from(selected).forEach(function (qid) { moveQuestionInTestLocal(activeTestId, qid, target, null); });
  selected = new Set();
  addToMenuOpen = false;
  await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  refreshBank();
  refreshBuilder();
}
function exportQuestionsOnly() {
  var list = selected.size > 0 ? questions.filter(function (q) { return selected.has(q.id); }) : questions;
  downloadJSON(list, "questions-" + new Date().toISOString().slice(0, 10) + ".json");
}

/* ---------- test builder ---------- */
function moveQuestionInTestLocal(testId, questionId, target, beforeId) {
  tests = tests.map(function (t) {
    if (t.id !== testId) return t;
    var cleared = withQuestionRemoved(t, questionId);
    if (target.type === "loose") {
      var idx = cleared.looseQuestionIds.length;
      if (beforeId) { var bi = cleared.looseQuestionIds.indexOf(beforeId); if (bi !== -1) idx = bi; }
      var arr = cleared.looseQuestionIds.slice();
      arr.splice(idx, 0, questionId);
      cleared.looseQuestionIds = arr;
      return cleared;
    }
    cleared.groups = cleared.groups.map(function (g) {
      if (g.id !== target.groupId) return g;
      var idx2 = g.questionIds.length;
      if (beforeId) { var bi2 = g.questionIds.indexOf(beforeId); if (bi2 !== -1) idx2 = bi2; }
      var arr2 = g.questionIds.slice();
      arr2.splice(idx2, 0, questionId);
      return { id: g.id, name: g.name, questionIds: arr2 };
    });
    return cleared;
  });
}
async function dropIntoTest(e, target, beforeId) {
  e.preventDefault ? e.preventDefault() : null;
  if (!activeTestId) return;
  var payload;
  try { payload = JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) { return; }
  if (payload.ids) payload.ids.forEach(function (qid) { moveQuestionInTestLocal(activeTestId, qid, target, beforeId); });
  else if (payload.moveFrom) moveQuestionInTestLocal(activeTestId, payload.moveFrom.questionId, target, beforeId);
  document.querySelectorAll(".group-card-over").forEach(function (n) { n.classList.remove("group-card-over"); });
  await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  refreshBuilder();
}
async function handleDropOntoBank(e) {
  e.preventDefault();
  var payload;
  try { payload = JSON.parse(e.dataTransfer.getData("application/json")); } catch (err) { return; }
  if (payload.moveFrom && activeTestId) {
    tests = tests.map(function (t) { return t.id === activeTestId ? withQuestionRemoved(t, payload.moveFrom.questionId) : t; });
    await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
    refreshBuilder();
  }
}
function handleTestDragStart(e, qid) {
  e.dataTransfer.setData("application/json", JSON.stringify({ moveFrom: { questionId: qid } }));
  e.dataTransfer.effectAllowed = "move";
}
function highlightGroup(el, id) {

}
function unhighlightGroup(el, id) { el.classList.remove("group-card-over"); }
async function removeFromTest(qid) {
  if (!activeTestId) return;
  tests = tests.map(function (t) { return t.id === activeTestId ? withQuestionRemoved(t, qid) : t; });
  await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  refreshBuilder();
}

function groupCardHTML(t, g, gi) {

function testTabsHTML() {

    }

function testActionsHTML() {
  var t = tests.find(function (x) { return x.id === activeTestId; });
  return (t ? '<button class="btn btn-outline btn-sm" onclick="exportTest(\'' + t.id + '\')">Export JSON</button>' : '') +
    '<button class="btn btn-primary btn-sm" onclick="addTest()">+ New test</button>';
}
function testContentHTML() {
  var t = tests.find(function (x) { return x.id === activeTestId; });
  if (!t) return '<div class="empty">Create a test to start building — then drag questions in from the bank.</div>';
  var html = looseSectionHTML(t);
  html += t.groups.map(function (g, gi) { return groupCardHTML(t, g, gi); }).join('');
  html += '<button class="btn-dashed" onclick="addGroup()">+ Add group</button>';
  return html;
}
async function addTest() {
  var id = uid("test");
  var t = { id: id, name: "Test " + (tests.length + 1), looseQuestionIds: [], groups: [{ id: uid("grp"), name: "Group 1", questionIds: [] }] };
  tests = tests.concat([t]);
  activeTestId = id;
  await persistTestPut(t);
  refreshBank();
  refreshBuilder();
}
function startRenameTest(id) { renamingTestId = id; refreshBuilder(); }
async function commitRenameTest(e, id) {
  var name = e.target.value.trim();
  renamingTestId = null;
  if (name) {
    tests = tests.map(function (t) { return t.id === id ? { id: t.id, name: name, looseQuestionIds: t.looseQuestionIds, groups: t.groups } : t; });
    await persistTestPut(tests.find(function (t) { return t.id === id; }));
  }
  refreshBuilder();
}
function setActiveTest(id) { activeTestId = id; refreshBank(); refreshBuilder(); }
function askDeleteTest(id) { pendingDeleteTest = id; refreshBuilder(); }
function cancelDeleteTest() { pendingDeleteTest = null; refreshBuilder(); }
async function deleteTest(id) {
  var wasActive = activeTestId === id;
  tests = tests.filter(function (t) { return t.id !== id; });
  if (wasActive) activeTestId = tests[0] ? tests[0].id : null;
  pendingDeleteTest = null;
  await persistTestDelete(id);
  refreshBank();
  refreshBuilder();
}
async function addGroup() {
  if (!activeTestId) return;
  tests = tests.map(function (t) {
    if (t.id !== activeTestId) return t;
    return { id: t.id, name: t.name, looseQuestionIds: t.looseQuestionIds, groups: t.groups.concat([{ id: uid("grp"), name: "Group " + (t.groups.length + 1), questionIds: [] }]) };
  });
  await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  refreshBuilder();
}
async function commitRenameGroup(e, groupId) {
  var name = e.target.value.trim();
  if (name && activeTestId) {
    tests = tests.map(function (t) {
      if (t.id !== activeTestId) return t;
      return { id: t.id, name: t.name, looseQuestionIds: t.looseQuestionIds, groups: t.groups.map(function (g) { return g.id === groupId ? { id: g.id, name: name, questionIds: g.questionIds } : g; }) };
    });
    await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  }
  refreshBuilder();
}
function askDeleteGroup(id) { pendingDeleteGroup = id; refreshBuilder(); }
function cancelDeleteGroup() { pendingDeleteGroup = null; refreshBuilder(); }
async function deleteGroup(id) {
  tests = tests.map(function (t) {
    if (t.id !== activeTestId) return t;
    return { id: t.id, name: t.name, looseQuestionIds: t.looseQuestionIds, groups: t.groups.filter(function (g) { return g.id !== id; }) };
  });
  pendingDeleteGroup = null;
  await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  refreshBuilder();
}
async function moveGroup(id, dir) {
  tests = tests.map(function (t) {
    if (t.id !== activeTestId) return t;
    var idx = t.groups.findIndex(function (g) { return g.id === id; });
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= t.groups.length) return t;
    var groups = t.groups.slice();
    var tmp = groups[idx]; groups[idx] = groups[newIdx]; groups[newIdx] = tmp;
    return { id: t.id, name: t.name, looseQuestionIds: t.looseQuestionIds, groups: groups };
  });
  await persistTestPut(tests.find(function (t) { return t.id === activeTestId; }));
  refreshBuilder();
}
function exportTest(id) {
  var t = tests.find(function (x) { return x.id === id; });
  if (!t) return;
  var byId = new Map(questions.map(function (q) { return [q.id, q]; }));
  var payload = {
    name: t.name,
    ungrouped: t.looseQuestionIds.map(function (qid) { return byId.get(qid); }).filter(Boolean),
    groups: t.groups.map(function (g) { return { name: g.name, questions: g.questionIds.map(function (qid) { return byId.get(qid); }).filter(Boolean) }; }),
  };
  downloadJSON(payload, t.name.replace(/\s+/g, "_") + ".json");
}

/* ---------- question form (add/edit with versions) ---------- */
function openAddQuestion() {
  editingId = null; editingContext = null;
  formState = { category: "", text: "", correctText: "", correctJust: "", wrong: [{ text: "", justification: "" }], tagsInput: "" };
  formMode = "new";
  refreshModal();
}
function loadFormStateFrom(id) {
  var q = questions.find(function (x) { return x.id === id; });
  formState = {
    category: q ? q.category : "", text: q ? q.text : "",
    correctText: q ? q.correct.text : "", correctJust: q ? q.correct.justification : "",
    wrong: (q && q.wrong.length) ? q.wrong.map(function (w) { return { text: w.text, justification: w.justification }; }) : [{ text: "", justification: "" }],
    tagsInput: q ? q.tags.join(", ") : "",
  };
}
function openEditFromBank(id) { editingId = id; editingContext = null; loadFormStateFrom(id); formMode = "edit"; refreshModal(); }
function openEditFromTest(id, location) { editingId = id; editingContext = { testId: activeTestId, location: location }; loadFormStateFrom(id); formMode = "edit"; refreshModal(); }
function closeForm() { formMode = null; editingId = null; editingContext = null; formState = null; refreshModal(); }
function fsSet(field, value) { if (formState) formState[field] = value; }
function fsSetWrong(i, field, value) { if (formState) formState.wrong[i][field] = value; }
function addWrongRow() { formState.wrong.push({ text: "", justification: "" }); refreshWrongSection(); }
function removeWrongRow(i) { formState.wrong.splice(i, 1); refreshWrongSection(); }
function refreshWrongSection() { var el = document.getElementById("wrong-section"); if (el) el.innerHTML = wrongSectionHTML(); }

async function requestSaveQuestion(method) {
  var fs = formState;
  if (!fs.text.trim() || !fs.correctText.trim()) return;
  var data = {
    category: fs.category.trim(), text: fs.text.trim(),
    correct: { text: fs.correctText.trim(), justification: fs.correctJust.trim() },
    wrong: fs.wrong.filter(function (w) { return w.text.trim(); }),
    tags: fs.tagsInput.split(",").map(function (t) { return t.trim(); }).filter(Boolean),
  };
  if (!editingId) {
    var id = uid("q");
    var q = { id: id, familyId: id, version: 1, history: [], updatedAt: Date.now(), category: data.category, text: data.text, correct: data.correct, wrong: data.wrong, tags: data.tags };
    questions = questions.concat([q]);
    await persistQuestionPut(q);
    closeForm(); refreshBank();
    return;
  }
  if (method === "overwrite") {
    var refs = findReferences(tests, editingId);
    if (refs.length > 0) { pendingOverwrite = { data: data, refs: refs }; refreshModal(); return; }
    await applyOverwrite(editingId, data);
    closeForm(); refreshBank(); refreshBuilder();
  } else if (method === "newVersion") {
    await applyNewVersion(editingId, data, editingContext);
    closeForm(); refreshBank(); refreshBuilder();
  }
}
async function applyOverwrite(id, data) {
  var updated = null;
  questions = questions.map(function (q) {
    if (q.id !== id) return q;
    updated = { id: q.id, familyId: q.familyId, version: q.version + 1, history: q.history.concat([snapshotOf(q)]), updatedAt: Date.now(), category: data.category, text: data.text, correct: data.correct, wrong: data.wrong, tags: data.tags };
    return updated;
  });
  if (updated) await persistQuestionPut(updated);
}
async function applyNewVersion(id, data, context) {
  var original = questions.find(function (q) { return q.id === id; });
  if (!original) return;
  var newId = uid("q");
  var newQ = { id: newId, familyId: original.familyId, version: original.version + 1, history: original.history.concat([snapshotOf(original)]), updatedAt: Date.now(), category: data.category, text: data.text, correct: data.correct, wrong: data.wrong, tags: data.tags };
  questions = questions.concat([newQ]);
  await persistQuestionPut(newQ);
  if (context) {
    tests = tests.map(function (t) {
      if (t.id !== context.testId) return t;
      if (context.location.type === "loose") {
        return { id: t.id, name: t.name, looseQuestionIds: t.looseQuestionIds.map(function (qid) { return qid === id ? newId : qid; }), groups: t.groups };
      }
      return { id: t.id, name: t.name, looseQuestionIds: t.looseQuestionIds, groups: t.groups.map(function (g) {
        return g.id === context.location.groupId ? { id: g.id, name: g.name, questionIds: g.questionIds.map(function (qid) { return qid === id ? newId : qid; }) } : g;
      }) };
    });
    await persistTestPut(tests.find(function (t) { return t.id === context.testId; }));
  }
}
async function confirmOverwrite() {
  if (!pendingOverwrite) return;
  await applyOverwrite(editingId, pendingOverwrite.data);
  pendingOverwrite = null;
  closeForm(); refreshBank(); refreshBuilder();
}
function cancelOverwrite() { pendingOverwrite = null; refreshModal(); }
function openHistory(id) { historyForId = id; refreshModal(); }
function closeHistory() { historyForId = null; refreshModal(); }

/* ---------- import ---------- */
function openImport() { importOpen = true; importText = ""; importError = ""; refreshModal(); }
function closeImport() { importOpen = false; refreshModal(); }
function onImportInput(e) { importText = e.target.value; }
async function handleImportSubmit() {
  try {
    var parsed = JSON.parse(importText);
    var arr = Array.isArray(parsed) ? parsed : [parsed];
    var mapped = arr.map(function (item) {
      var id = uid("q");
      return {
        id: id, familyId: id, version: 1, history: [], updatedAt: Date.now(),
        category: item.category || "", text: item.question || "",
        correct: { text: (item.answers && item.answers.correct) || "", justification: (item.justification && item.justification.correct) || "" },
        wrong: ((item.answers && item.answers.wrong) || []).map(function (w, i) {
          return { text: w, justification: ((item.justification && item.justification.wrong) || [])[i] || "" };
        }),
        tags: [],
      };
    });
    questions = questions.concat(mapped);
    await Promise.all(mapped.map(persistQuestionPut));
    importOpen = false;
    refreshBank(); refreshModal();
  } catch (e) {
    importError = "Couldn't parse that as JSON. Check the format and try again.";
    refreshModal();
  }
}

/* ---------- modal HTML ---------- */
function modalRootHTML() {
  var html = "";
  if (formMode) html += questionFormModalHTML();
  if (pendingOverwrite) html += confirmOverwriteModalHTML();
  if (historyForId) html += versionHistoryModalHTML();
  if (importOpen) html += importModalHTML();
  return html;
}
function wrongSectionHTML() {
  return formState.wrong.map(function (w, i) {
    return '<div class="answer-block wrong-block">' +
      '<button class="icon-btn wrong-remove" onclick="removeWrongRow(' + i + ')">✕</button>' +
      '<textarea class="form-textarea" rows="2" oninput="fsSetWrong(' + i + ', \'text\', this.value)" placeholder="Answer text">' + esc(w.text) + '</textarea>' +
      '<textarea class="form-textarea" rows="2" oninput="fsSetWrong(' + i + ', \'justification\', this.value)" placeholder="Justification">' + esc(w.justification) + '</textarea>' +
    '</div>';
  }).join('');
}
function questionFormModalHTML() {
  var fs = formState;
  var footer = formMode === "edit"
    ? '<p class="hint">Editing this version changes it everywhere it\'s used. Saving as a new version leaves other tests on the old one.</p>' +
      '<div class="row-end gap-2"><button class="btn btn-outline" onclick="closeForm()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="requestSaveQuestion(\'newVersion\')">Save as new version</button>' +
      '<button class="btn btn-danger-outline" onclick="requestSaveQuestion(\'overwrite\')">Edit this version</button></div>'
    : '<div class="row-end gap-2"><button class="btn btn-outline" onclick="closeForm()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="requestSaveQuestion(undefined)">Save</button></div>';
  return '<div class="modal-overlay"><div class="modal">' +
    '<div class="modal-header"><h2>' + (formMode === "edit" ? "Edit question" : "Add question") + '</h2><button class="icon-btn" onclick="closeForm()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-field"><label>Category</label><input class="form-input" value="' + esc(fs.category) + '" oninput="fsSet(\'category\', this.value)" placeholder="e.g. combined (offensive) — case study: ..."></div>' +
      '<div class="form-field"><label>Question</label><textarea class="form-textarea" rows="3" oninput="fsSet(\'text\', this.value)">' + esc(fs.text) + '</textarea></div>' +
      '<div class="answer-block correct-block"><label>Correct answer</label>' +
        '<textarea class="form-textarea" rows="2" oninput="fsSet(\'correctText\', this.value)" placeholder="Answer text">' + esc(fs.correctText) + '</textarea>' +
        '<textarea class="form-textarea" rows="2" oninput="fsSet(\'correctJust\', this.value)" placeholder="Justification">' + esc(fs.correctJust) + '</textarea></div>' +
      '<div class="form-field"><div class="row-between"><label>Wrong answers</label><button class="link" onclick="addWrongRow()">+ add</button></div>' +
        '<div id="wrong-section">' + wrongSectionHTML() + '</div></div>' +
      '<div class="form-field"><label>Tags</label><input class="form-input mono" value="' + esc(fs.tagsInput) + '" oninput="fsSet(\'tagsInput\', this.value)" placeholder="comma, separated, tags"></div>' +
    '</div>' +
    '<div class="modal-footer">' + footer + '</div>' +
  '</div></div>';
}
function confirmOverwriteModalHTML() {
  var refs = pendingOverwrite.refs;
  return '<div class="modal-overlay"><div class="modal modal-sm">' +
    '<div class="modal-header"><span class="warn-icon">⚠</span><h2>This question is used elsewhere</h2></div>' +
    '<div class="modal-body"><p>Editing this version directly will change it everywhere it\'s referenced:</p>' +
    '<ul class="ref-list">' + refs.map(function (r) { return '<li>' + esc(r.testName) + ' — ' + esc(r.where) + '</li>'; }).join('') + '</ul>' +
    '<p class="hint">If you only want this test to see the change, cancel and choose "Save as new version" instead.</p></div>' +
    '<div class="modal-footer"><div class="row-end gap-2"><button class="btn btn-outline" onclick="cancelOverwrite()">Cancel</button>' +
    '<button class="btn btn-danger" onclick="confirmOverwrite()">Edit everywhere</button></div></div>' +
  '</div></div>';
}
function versionHistoryModalHTML() {
  var q = questions.find(function (x) { return x.id === historyForId; });
  if (!q) return "";
  var entries = q.history.concat([{ version: q.version, savedAt: q.updatedAt, text: q.text, correct: q.correct, current: true }])
    .sort(function (a, b) { return b.version - a.version; });
  return '<div class="modal-overlay"><div class="modal modal-sm">' +
    '<div class="modal-header"><h2>Version history</h2><button class="icon-btn" onclick="closeHistory()">✕</button></div>' +
    '<div class="modal-body">' + entries.map(function (e) {
      return '<div class="history-entry ' + (e.current ? 'history-current' : '') + '">' +
        '<div class="row-between xs muted"><span class="mono">v' + e.version + (e.current ? ' (current)' : '') + '</span>' +
        '<span>' + (e.savedAt ? new Date(e.savedAt).toLocaleString() : '') + '</span></div>' +
        '<div class="q-text">' + esc(e.text) + '</div>' +
        '<div class="option-correct xs">✓ ' + esc(e.correct ? e.correct.text : '') + '</div></div>';
    }).join('') + '</div>' +
  '</div></div>';
}
function importModalHTML() {
  return '<div class="modal-overlay"><div class="modal">' +
    '<div class="modal-header"><h2>Import questions (JSON)</h2><button class="icon-btn" onclick="closeImport()">✕</button></div>' +
    '<div class="modal-body"><p class="hint">Paste an array of questions in the category / question / answers / justification format. Tags come in empty — select the imported items in the bank and apply tags in bulk afterward.</p>' +
    '<textarea class="form-textarea mono" rows="10" oninput="onImportInput(event)" placeholder=\'[ { "category": ..., "question": ..., "answers": {...}, "justification": {...} } ]\'>' + esc(importText) + '</textarea>' +
    (importError ? '<p class="err-text">' + esc(importError) + '</p>' : '') + '</div>' +
    '<div class="modal-footer"><div class="row-end gap-2"><button class="btn btn-outline" onclick="closeImport()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="handleImportSubmit()">Import</button></div></div>' +
  '</div></div>';
}

/* ---------- backup ---------- */
function exportBackup() {
  downloadJSON({ schemaVersion: 1, exportedAt: new Date().toISOString(), questions: questions, tests: tests }, "qbank-backup-" + new Date().toISOString().slice(0, 10) + ".json");
}
function onBackupFileSelected(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(String(reader.result));
      var migrated = migrateData(parsed);
      if (questions.length === 0 && tests.length === 0) {
        applyLoadedData(migrated);
      } else {
        pendingBackupLoad = migrated;
        refreshHeader();
      }
      backupError = "";
    } catch (err) {
      backupError = "Couldn't read that file as a backup.";
      refreshHeader();
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}
async function applyLoadedData(data) {
  questions = data.questions;
  tests = data.tests;
  activeTestId = tests[0] ? tests[0].id : null;
  if (dbAvailable) {
    try {
      await idbClear("questions"); await idbClear("tests");
      await idbBulkPut("questions", questions); await idbBulkPut("tests", tests);
    } catch (e) { dbSaveError = true; }
  }
  pendingBackupLoad = null;
  renderAll();
}
function confirmLoadBackup() { if (pendingBackupLoad) applyLoadedData(pendingBackupLoad); }
function cancelLoadBackup() { pendingBackupLoad = null; refreshHeader(); }

/* ---------- reset ---------- */
function askReset() { resetConfirm = true; refreshHeader(); }
function cancelReset() { resetConfirm = false; refreshHeader(); }
async function resetAll() {
  questions = []; tests = []; activeTestId = null; selected = new Set(); resetConfirm = false;
  if (dbAvailable) { try { await idbClear("questions"); await idbClear("tests"); } catch (e) { dbSaveError = true; } }
  renderAll();
}

init();
</script>
